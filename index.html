/* ============================================================================
   All-in-One Mastery Dashboard — "Study Powerhouse" edition
   ----------------------------------------------------------------------------
   Five views:
     1. Active Recall & Spaced Repetition (Leitner box flashcards)
     2. Capture (paste text, drop real PDFs/images/text files for client-side
        extraction + OCR, or record a lecture with live transcription)
     3. Feynman Sandbox (explain-it-simply input with real or heuristic AI
        feedback)
     4. Visual Mindmap (expandable topic tree, "ask the Study Buddy" per node)
     5. Export Center (Anki-importable deck export, Notion-ready Markdown)

   Plus a collapsible AI Study Buddy chat drawer and a Settings panel for a
   user-supplied Claude API key.

   ----------------------------------------------------------------------------
   HONEST NOTES ON WHAT'S REAL VS. WHAT DEGRADES GRACEFULLY
   ----------------------------------------------------------------------------
   - PDF text extraction (pdf.js) and image OCR (Tesseract.js) are genuinely
     real, running entirely client-side. PDF extraction only recovers text
     that exists in the PDF's text layer (scanned pages with no text layer go
     through OCR the same as a photo would, and OCR accuracy varies by image
     quality).
   - The audio recorder genuinely records via MediaRecorder and draws a live
     waveform via the Web Audio API. Live speech-to-text uses the browser's
     native Web Speech API (SpeechRecognition), which today is reliably
     available in Chrome/Edge and not in Firefox/Safari — the recorder
     detects support and tells you plainly when live transcription isn't
     available, while audio recording + playback still works everywhere.
   - "Real AI" (summarization, flashcard generation, Feynman feedback, and
     the Study Buddy chat) calls the Anthropic Claude API directly from your
     browser using an API key you provide in Settings. It is stored only in
     this browser's localStorage and sent only to https://api.anthropic.com.
     With no key configured, every feature falls back automatically to the
     local heuristics that shipped in earlier versions of this app, so the
     app is fully usable with zero setup — just less smart about it.
   - The Anki export produces a real, importable tab-separated text file
     using Anki's documented header-directive format (#separator/#html/
     #notetype/#deck) rather than a hand-rolled binary .apkg — that keeps the
     export reliable without a server-side SQLite/zip toolchain. The Notion
     export produces clean Markdown (headings, nested bullets, a table) that
     Notion's Markdown importer reads natively.
   ============================================================================ */

/* =========================================================================
   AI INTEGRATION LAYER
   Real calls to the Anthropic Claude API, made directly from the browser
   using the "anthropic-dangerous-direct-browser-access" header Anthropic
   documents for exactly this client-side use case. Every caller degrades to
   a local heuristic automatically when no key is configured or the call
   fails, so nothing in the app ever shows a dead end.
   ========================================================================= */

const CLAUDE_API_URL = "https://api.anthropic.com/v1/messages";
const CLAUDE_API_VERSION = "2023-06-01";
const DEFAULT_MODEL = "claude-sonnet-5";

const LS_KEYS = {
  apiKey: "mastery_dashboard_claude_api_key",
  model: "mastery_dashboard_claude_model",
  cards: "mastery_dashboard_cards_v1",
};

const AISettingsContext = React.createContext({ apiKey: "", model: DEFAULT_MODEL, hasKey: false });

async function callClaude(apiKey, model, { system, messages, maxTokens = 1024 }) {
  let res;
  try {
    res = await fetch(CLAUDE_API_URL, {
      method: "POST",
      headers: {
        "content-type": "application/json",
        "x-api-key": apiKey,
        "anthropic-version": CLAUDE_API_VERSION,
        "anthropic-dangerous-direct-browser-access": "true",
      },
      body: JSON.stringify({ model: model || DEFAULT_MODEL, max_tokens: maxTokens, system, messages }),
    });
  } catch (networkErr) {
    throw new Error("Couldn't reach the Claude API — check your connection (and that nothing is blocking cross-origin requests).");
  }

  if (!res.ok) {
    let detail = `HTTP ${res.status}`;
    try {
      const body = await res.json();
      detail = body?.error?.message || detail;
    } catch {
      /* response wasn't JSON — keep the generic status detail */
    }
    if (res.status === 401) detail = "Invalid API key. Double-check the key in Settings.";
    throw new Error(`Claude API error: ${detail}`);
  }

  const data = await res.json();
  return (data.content || [])
    .filter((block) => block.type === "text")
    .map((block) => block.text)
    .join("\n")
    .trim();
}

// Pulls the first JSON array/object out of a model response, tolerating
// markdown code fences or stray prose around it.
function extractJson(raw) {
  const fenced = raw.match(/```(?:json)?\s*([\s\S]*?)```/i);
  const candidate = (fenced ? fenced[1] : raw).trim();
  const firstBrace = candidate.indexOf("{");
  const firstBracket = candidate.indexOf("[");
  const starts = [firstBrace, firstBracket].filter((i) => i !== -1);
  if (starts.length === 0) throw new Error("No JSON found in the model's response.");
  const start = Math.min(...starts);
  const isArray = candidate[start] === "[";
  const end = isArray ? candidate.lastIndexOf("]") : candidate.lastIndexOf("}");
  if (end <= start) throw new Error("Malformed JSON in the model's response.");
  return JSON.parse(candidate.slice(start, end + 1));
}

/* ------------------------ Local heuristic fallbacks ---------------------- */

const STOPWORDS = new Set([
  "the", "a", "an", "and", "or", "but", "is", "are", "was", "were", "be", "been", "being",
  "to", "of", "in", "on", "for", "with", "as", "by", "at", "from", "that", "this", "these",
  "those", "it", "its", "into", "than", "then", "so", "such", "can", "will", "would", "should",
  "which", "who", "whom", "there", "their", "them", "they", "we", "you", "your", "our", "not",
  "also", "if", "when", "while", "each", "any", "all", "more", "most", "other", "some", "over",
]);

function splitSentences(text) {
  return text
    .replace(/\s+/g, " ")
    .trim()
    .split(/(?<=[.!?])\s+(?=[A-Z0-9"'(])/)
    .map((s) => s.trim())
    .filter((s) => s.length > 12);
}

function summarizeTextLocal(text, maxSentences = 4) {
  const sentences = splitSentences(text);
  if (sentences.length === 0) return [];
  if (sentences.length <= maxSentences) return sentences;

  const freq = {};
  sentences.forEach((s) => {
    (s.toLowerCase().match(/[a-z']+/g) || []).forEach((w) => {
      if (w.length > 2 && !STOPWORDS.has(w)) freq[w] = (freq[w] || 0) + 1;
    });
  });

  const scored = sentences.map((s, i) => {
    const words = s.toLowerCase().match(/[a-z']+/g) || [];
    const score = words.reduce((sum, w) => sum + (freq[w] || 0), 0) / (words.length || 1);
    return { s, i, score: score + (i === 0 ? 0.5 : 0) };
  });

  return scored
    .sort((a, b) => b.score - a.score)
    .slice(0, maxSentences)
    .sort((a, b) => a.i - b.i)
    .map((t) => t.s);
}

function generateFlashcardsLocal(text, max = 8) {
  const sentences = splitSentences(text).filter((s) => s.length > 20).slice(0, max);
  return sentences.map((s) => {
    const m = s.match(/^([A-Z][A-Za-z0-9 '()-]{1,45}?)\s+(is|are|refers to|means|represents)\s+(.+)$/);
    if (m) {
      const verb = m[2].toLowerCase() === "are" ? "are" : "is";
      return { question: `What ${verb} ${m[1].trim()}?`, answer: s };
    }
    const words = s.split(" ");
    const excerpt = words.slice(0, 7).join(" ") + (words.length > 7 ? "…" : "");
    return { question: `Explain: "${excerpt}"`, answer: s };
  });
}

function evaluateExplanationLocal(text) {
  const words = text.trim().split(/\s+/).filter(Boolean);
  const wordCount = words.length;
  const hasJargon = /\b(therefore|utilize|paradigm|methodology|inherent)\b/i.test(text);
  const hasAnalogy = /\b(like|similar to|imagine|think of it as|just as)\b/i.test(text);
  const hasExample = /\b(for example|for instance|e\.g\.|such as)\b/i.test(text);

  let clarity = 40;
  if (wordCount > 25) clarity += 15;
  if (wordCount > 60) clarity += 10;
  if (hasAnalogy) clarity += 20;
  if (hasExample) clarity += 15;
  if (hasJargon) clarity -= 20;
  clarity = Math.max(5, Math.min(98, clarity));

  const notes = [];
  if (wordCount < 15) notes.push("Your explanation is quite short — try expanding with a concrete example.");
  if (hasJargon) notes.push("Watch out for jargon words (e.g. 'utilize', 'paradigm') — swap them for plain language.");
  if (!hasAnalogy) notes.push("Try adding an everyday analogy — Feynman explanations lean on relatable comparisons.");
  if (!hasExample) notes.push("Consider grounding the idea with a concrete example.");
  if (notes.length === 0) notes.push("Solid, plain-language explanation with a clear example or analogy.");

  return { clarity, wordCount, notes };
}

function deriveTopicFromText(text) {
  const first = splitSentences(text)[0] || text.trim();
  const words = first.split(" ").slice(0, 6).join(" ");
  return words.length > 2 ? words.replace(/[.!?]+$/, "") : "Imported notes";
}

/* =========================================================================
   REAL CLIENT-SIDE CONTENT EXTRACTION (PDF text layer + image OCR)
   ========================================================================= */

const PDFJS_VERSION = "6.3.289";
const TESSERACT_LANG = "eng";

let pdfjsLoadPromise = null;
function loadPdfJs() {
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (!pdfjsLoadPromise) {
    pdfjsLoadPromise = import(
      /* webpackIgnore: true */ `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.min.mjs`
    ).then((mod) => {
      mod.GlobalWorkerOptions.workerSrc = `https://cdnjs.cloudflare.com/ajax/libs/pdf.js/${PDFJS_VERSION}/pdf.worker.min.mjs`;
      window.pdfjsLib = mod;
      return mod;
    });
  }
  return pdfjsLoadPromise;
}

async function extractTextFromFile(file, onStatus = () => {}) {
  const name = file.name.toLowerCase();
  const isPdf = file.type === "application/pdf" || name.endsWith(".pdf");
  const isImage = file.type.startsWith("image/");

  if (isPdf) {
    onStatus("Loading PDF engine…");
    const pdfjsLib = await loadPdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    let text = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      onStatus(`Extracting page ${i} of ${pdf.numPages}…`);
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      const pageText = content.items.map((item) => item.str).join(" ");
      text += pageText + "\n\n";
    }
    const trimmed = text.trim();
    if (!trimmed) {
      throw new Error("No embedded text found — this PDF may be scanned. Try exporting its pages as images and dropping those instead for OCR.");
    }
    return trimmed;
  }

  if (isImage) {
    if (!window.Tesseract) throw new Error("OCR engine failed to load — check your connection and try again.");
    onStatus("Running OCR…");
    const { data } = await window.Tesseract.recognize(file, TESSERACT_LANG, {
      logger: (m) => {
        if (m.status === "recognizing text") onStatus(`OCR: ${Math.round((m.progress || 0) * 100)}%`);
        else if (m.status) onStatus(m.status);
      },
    });
    return (data.text || "").trim();
  }

  onStatus("Reading file…");
  return (await file.text()).trim();
}

function downloadBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

function escapeTsvField(s) {
  return String(s).replace(/\t/g, "  ").replace(/\r?\n/g, " ").trim();
}

// Real, Anki-importable plain-text export using Anki's documented header
// directives (File > Import in Anki; the header lines pre-configure the
// separator, HTML handling, note type, and target deck automatically).
function buildAnkiExport(cards, deckName = "Mastery Dashboard") {
  const header = [`#separator:tab`, `#html:false`, `#notetype:Basic`, `#deck:${deckName}`].join("\n");
  const rows = cards.map((c) => `${escapeTsvField(c.question)}\t${escapeTsvField(c.answer)}`).join("\n");
  return `${header}\n${rows}\n`;
}

function mindmapToMarkdown(node, depth = 0) {
  const indent = "  ".repeat(depth);
  let out = `${indent}- ${node.name}\n`;
  (node.children || []).forEach((child) => {
    out += mindmapToMarkdown(child, depth + 1);
  });
  return out;
}

function buildNotionMarkdown({ cards, mindmap, notes }) {
  const date = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
  let md = `# Mastery Dashboard Export\n_Generated ${date}_\n\n`;

  if (notes && notes.trim()) {
    md += `## Notes\n\n${notes.trim()}\n\n`;
  }

  if (cards && cards.length) {
    md += `## Flashcards\n\n| Question | Answer |\n| --- | --- |\n`;
    cards.forEach((c) => {
      md += `| ${c.question.replace(/\|/g, "\\|")} | ${c.answer.replace(/\|/g, "\\|")} |\n`;
    });
    md += `\n`;
  }

  if (mindmap) {
    md += `## Mindmap\n\n${mindmapToMarkdown(mindmap)}\n`;
  }

  return md;
}

function RecorderTab({ onTranscriptReady }) {
  const [status, setStatus] = useState("idle"); // idle | recording | stopped
  const [seconds, setSeconds] = useState(0);
  const [transcript, setTranscript] = useState("");
  const [interim, setInterim] = useState("");
  const [audioUrl, setAudioUrl] = useState(null);
  const [error, setError] = useState(null);
  const speechSupported = typeof window !== "undefined" && !!(window.SpeechRecognition || window.webkitSpeechRecognition);

  const canvasRef = useRef(null);
  const streamRef = useRef(null);
  const audioCtxRef = useRef(null);
  const analyserRef = useRef(null);
  const rafRef = useRef(null);
  const recorderRef = useRef(null);
  const chunksRef = useRef([]);
  const recognitionRef = useRef(null);
  const timerRef = useRef(null);

  const drawWaveform = useCallback(() => {
    const canvas = canvasRef.current;
    const analyser = analyserRef.current;
    if (!canvas || !analyser) return;
    const ctx = canvas.getContext("2d");
    const bufferLength = analyser.fftSize;
    const dataArray = new Uint8Array(bufferLength);

    const render = () => {
      rafRef.current = requestAnimationFrame(render);
      analyser.getByteTimeDomainData(dataArray);
      const w = canvas.width;
      const h = canvas.height;
      ctx.clearRect(0, 0, w, h);
      ctx.lineWidth = 2;
      ctx.strokeStyle = "#a78bfa";
      ctx.beginPath();
      const slice = w / bufferLength;
      let x = 0;
      for (let i = 0; i < bufferLength; i++) {
        const v = dataArray[i] / 128.0;
        const y = (v * h) / 2;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
        x += slice;
      }
      ctx.lineTo(w, h / 2);
      ctx.stroke();
    };
    render();
  }, []);

  const start = async () => {
    setError(null);
    setTranscript("");
    setInterim("");
    setAudioUrl(null);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      streamRef.current = stream;

      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      const audioCtx = new AudioCtx();
      const source = audioCtx.createMediaStreamSource(stream);
      const analyser = audioCtx.createAnalyser();
      analyser.fftSize = 2048;
      source.connect(analyser);
      audioCtxRef.current = audioCtx;
      analyserRef.current = analyser;
      drawWaveform();

      const mimeCandidates = ["audio/webm;codecs=opus", "audio/webm", "audio/ogg"];
      const mimeType = mimeCandidates.find((t) => window.MediaRecorder && MediaRecorder.isTypeSupported(t)) || "";
      const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
      chunksRef.current = [];
      recorder.ondataavailable = (e) => { if (e.data.size > 0) chunksRef.current.push(e.data); };
      recorder.onstop = () => {
        const blob = new Blob(chunksRef.current, { type: mimeType || "audio/webm" });
        setAudioUrl(URL.createObjectURL(blob));
      };
      recorder.start();
      recorderRef.current = recorder;

      if (speechSupported) {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SR();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = "en-US";
        recognition.onresult = (event) => {
          let finalChunk = "";
          let interimChunk = "";
          for (let i = event.resultIndex; i < event.results.length; i++) {
            const res = event.results[i];
            if (res.isFinal) finalChunk += res[0].transcript + " ";
            else interimChunk += res[0].transcript;
          }
          if (finalChunk) setTranscript((t) => (t + " " + finalChunk).trim());
          setInterim(interimChunk);
        };
        recognition.onerror = (e) => {
          if (e.error !== "no-speech") setError(`Live transcription hiccup: ${e.error}`);
        };
        recognition.onend = () => {
          if (recorderRef.current && recorderRef.current.state === "recording") {
            try { recognition.start(); } catch { /* already restarting */ }
          }
        };
        recognition.start();
        recognitionRef.current = recognition;
      }

      setSeconds(0);
      timerRef.current = window.setInterval(() => setSeconds((s) => s + 1), 1000);
      setStatus("recording");
    } catch (err) {
      setError(err.message || "Microphone access was denied.");
    }
  };

  const stop = () => {
    try { recorderRef.current?.stop(); } catch { /* already stopped */ }
    try { recognitionRef.current?.stop(); } catch { /* already stopped */ }
    streamRef.current?.getTracks().forEach((t) => t.stop());
    try { audioCtxRef.current?.close(); } catch { /* already closed */ }
    cancelAnimationFrame(rafRef.current);
    window.clearInterval(timerRef.current);
    setInterim("");
    setStatus("stopped");
  };

  useEffect(() => {
    return () => {
      try { recognitionRef.current?.stop(); } catch { /* noop */ }
      streamRef.current?.getTracks().forEach((t) => t.stop());
      try { audioCtxRef.current?.close(); } catch { /* noop */ }
      cancelAnimationFrame(rafRef.current);
      window.clearInterval(timerRef.current);
    };
  }, []);

  const mmss = `${String(Math.floor(seconds / 60)).padStart(2, "0")}:${String(seconds % 60).padStart(2, "0")}`;
  const fullTranscript = (transcript + " " + interim).trim();

  return (
    <div className="flex flex-col gap-4">
      <div className="rounded-2xl border border-slate-800 bg-slate-900/40 p-5">
        <div className="flex flex-wrap items-center justify-between gap-4">
          <div className="flex items-center gap-3">
            <div className={`flex h-11 w-11 items-center justify-center rounded-full ${status === "recording" ? "bg-rose-600" : "bg-slate-800"}`}>
              <Icon.Mic className="h-5 w-5 text-white" />
            </div>
            <div>
              <div className="font-mono text-lg tabular-nums text-slate-100">{mmss}</div>
              <div className="text-xs text-slate-500">
                {status === "recording" ? "Recording…" : status === "stopped" ? "Stopped" : "Ready to record"}
              </div>
            </div>
          </div>

          {status !== "recording" ? (
            <button
              onClick={start}
              className="flex items-center gap-2 rounded-xl bg-rose-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-rose-500"
            >
              <Icon.Mic className="h-4 w-4" /> Start Recording
            </button>
          ) : (
            <button
              onClick={stop}
              className="flex items-center gap-2 rounded-xl bg-slate-100 px-4 py-2.5 text-sm font-medium text-slate-900 transition hover:bg-white"
            >
              <Icon.Square className="h-4 w-4" /> Stop
            </button>
          )}
        </div>

        <canvas
          ref={canvasRef}
          width={640}
          height={80}
          className="mt-4 h-20 w-full rounded-xl bg-slate-950"
        />

        {!speechSupported && (
          <div className="mt-3 flex items-start gap-2 rounded-xl border border-amber-800/50 bg-amber-950/30 px-3 py-2 text-xs text-amber-300">
            <Icon.Alert className="h-4 w-4 shrink-0" />
            Live transcription needs the Web Speech API, which Chrome and Edge support but Firefox and Safari don't. Recording and playback still work here either way.
          </div>
        )}
        {error && (
          <div className="mt-3 flex items-start gap-2 rounded-xl border border-rose-800/50 bg-rose-950/30 px-3 py-2 text-xs text-rose-300">
            <Icon.Alert className="h-4 w-4 shrink-0" /> {error}
          </div>
        )}

        {audioUrl && (
          <audio controls src={audioUrl} className="mt-4 w-full" />
        )}
      </div>

      {(fullTranscript || status !== "idle") && speechSupported && (
        <div className="rounded-2xl border border-slate-800 bg-slate-900/40 p-5">
          <div className="mb-2 flex items-center justify-between">
            <div className="text-sm font-medium text-slate-300">Live transcript</div>
            {fullTranscript && status === "stopped" && (
              <button
                onClick={() => onTranscriptReady(transcript.trim())}
                className="flex items-center gap-1.5 rounded-lg border border-emerald-800/60 bg-emerald-950/40 px-3 py-1.5 text-xs font-medium text-emerald-300 transition hover:bg-emerald-900/40"
              >
                <Icon.ArrowRight className="h-3.5 w-3.5" /> Add to notes
              </button>
            )}
          </div>
          <p className="text-sm leading-relaxed text-slate-300">
            {transcript}
            <span className="text-slate-500">{interim}</span>
            {!fullTranscript && <span className="text-slate-600">Start recording and talk — words will appear here as they're recognized.</span>}
          </p>
        </div>
      )}
    </div>
  );
}

  const [selectedText, setSelectedText] = useState("");

  const settings = React.useContext(AISettingsContext);
  const toastTimer = useRef(null);

  const wordCount = notebookText.trim() ? notebookText.trim().split(/\s+/).length : 0;

  const flashToast = (msg) => {
    setToast(msg);
    window.clearTimeout(toastTimer.current);
    toastTimer.current = window.setTimeout(() => setToast(null), 3600);
  };

  const checkSelection = () => {
    const el = textareaRef.current;
    if (!el) return;
    setSelectedText(el.value.substring(el.selectionStart, el.selectionEnd).trim());
  };

  const appendText = (text, sourceName) => {
    setNotebookText((prev) => (prev.trim() ? `${prev.trim()}\n\n[From ${sourceName}]\n${text}` : text));
    setSummary(null);
  };

  const handleSummarize = async () => {
    if (!notebookText.trim()) return;
    setLoadingAction("summarize");
    setSummary(null);
    const { bullets, usedAI, error } = await aiSummarize(notebookText, settings);
    setSummary(bullets);
    setAiMeta({ usedAI, error });
    setLoadingAction(null);
  };

  const handleGenerateCards = async () => {
    if (!notebookText.trim()) return;
    setLoadingAction("cards");
    const { cards, usedAI, error } = await aiGenerateFlashcards(notebookText, settings, 8);
    setLoadingAction(null);
    if (cards.length === 0) {
      flashToast("Couldn't find enough content to build cards from — try adding more.");
      return;
    }
    onAddCards(cards);
    setAiMeta({ usedAI, error });
    flashToast(`${cards.length} flashcard${cards.length === 1 ? "" : "s"} (${usedAI ? "Claude" : "local heuristic"}) added to Box 1 — head to Active Recall to study them.`);
  };

  const handleSendToFeynman = () => {
    if (!notebookText.trim()) return;
    onSendToFeynman(deriveTopicFromText(notebookText));

            className={`rounded-lg px-3.5 py-1.5 text-sm font-medium transition ${
              subTab === t.key ? "bg-violet-600 text-white" : "text-slate-400 hover:text-slate-200"
            }`}
          >
            {t.label}
          </button>
        ))}
      </div>

      {subTab === "record" && <RecorderTab onTranscriptReady={(t) => appendText(t, "Audio recording")} />}

      {subTab === "paste" && (

            </button>

            <div className="mb-3 flex items-center justify-between">
              <div className="flex items-center gap-2 text-sm font-medium text-slate-300">
                <Icon.List className="h-4 w-4 text-violet-400" />
                Summary
              </div>

            </div>

            {loadingAction === "summarize" && (
              <div className="flex items-center gap-2 text-sm text-slate-500">
                <span className="h-2 w-2 animate-pulse rounded-full bg-violet-400" />
                Reading through your notes…
              </div>
            )}

            {loadingAction !== "summarize" && !summary && (
              <p className="text-sm text-slate-500">Click "Summarize" to get the key points here.</p>
            )}

            {loadingAction !== "summarize" && summary && summary.length > 0 && (
              <ul className="flex flex-col gap-2.5 animate-[fadeIn_0.3s_ease-out]">

                ))}

            )}
          </div>
        </div>
      </div>
    </div>
  );

function TreeNode({ node, depth = 0, defaultOpen = false, path = [], onAsk }) {
  const [open, setOpen] = useState(defaultOpen || depth < 1);
  const hasChildren = !!node.children?.length;
  const fullPath = [...path, node.name];

  return (
    <div className={depth > 0 ? "ml-4 border-l border-slate-800 pl-4" : ""}>
      <div className="group flex items-center gap-2 rounded-lg py-1.5 pr-2 hover:bg-slate-900/60">
        <div
          onClick={() => hasChildren && setOpen((o) => !o)}
          className={`flex flex-1 items-center gap-2 ${hasChildren ? "cursor-pointer" : ""}`}
        >
          {hasChildren ? (
            <Icon.ChevronRight
              className={`h-3.5 w-3.5 shrink-0 text-slate-500 transition-transform duration-300 ${open ? "rotate-90" : ""}`}
            />
          ) : (
            <span className="h-1.5 w-1.5 shrink-0 rounded-full bg-violet-500" />
          )}
          <span
            className={
              depth === 0
                ? "text-base font-semibold text-slate-100"
                : depth === 1
                ? "text-sm font-medium text-violet-300"
                : "text-sm text-slate-300"
            }
          >
            {node.name}
          </span>
          {hasChildren && (
            <span className="ml-1 rounded-full bg-slate-800 px-1.5 py-0.5 text-[10px] text-slate-500">
              {node.children.length}
            </span>
          )}
        </div>
        <button
          onClick={() => onAsk(fullPath.join(" › "))}
          title="Ask Study Buddy about this topic"
          className="shrink-0 rounded-md p-1 text-slate-600 opacity-0 transition hover:bg-violet-950/50 hover:text-violet-300 group-hover:opacity-100"
        >
          <Icon.MessageCircle className="h-3.5 w-3.5" />
        </button>
      </div>

      {hasChildren && (
        <div
          className={`grid overflow-hidden transition-all duration-300 ease-out ${
            open ? "grid-rows-[1fr] opacity-100" : "grid-rows-[0fr] opacity-0"
          }`}
        >
          <div className="min-h-0">
            {node.children.map((child, i) => (
              <TreeNode key={i} node={child} depth={depth + 1} path={fullPath} onAsk={onAsk} />
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

        <TreeNode node={MINDMAP_DATA} defaultOpen onAsk={onAskNode} />
      </div>

      <p className="text-xs text-slate-500">Head to the Export Center to turn this map into a Notion-ready Markdown file.</p>
    </div>
  );
}

/* ---------------------------- View 5: Export Center ------------------------ */

function ExportView({ cards, notebookText, summaryBullets }) {
  const [deckName, setDeckName] = useState("Mastery Dashboard");

  const handleAnkiExport = () => {
    const content = buildAnkiExport(cards, deckName || "Mastery Dashboard");
    downloadBlob(new Blob([content], { type: "text/plain;charset=utf-8" }), "mastery-dashboard-anki.txt");
  };

  const handleNotionExport = () => {
    const notes = summaryBullets && summaryBullets.length
      ? summaryBullets.map((b) => `- ${b}`).join("\n")
      : notebookText;
    const md = buildNotionMarkdown({ cards, mindmap: MINDMAP_DATA, notes });
    downloadBlob(new Blob([md], { type: "text/markdown;charset=utf-8" }), "mastery-dashboard-notion.md");
  };

  return (
    <div className="flex flex-col gap-6">
      <div>
        <h2 className="text-xl font-semibold text-slate-100">Export Center</h2>
        <p className="mt-1 text-sm text-slate-400">Take your deck, notes, and mindmap with you.</p>
      </div>

      <div className="grid gap-6 md:grid-cols-2">
        <div className="flex flex-col gap-4 rounded-2xl border border-slate-800 bg-slate-900/40 p-5">
          <div className="flex items-center gap-2.5">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-blue-600/90"><Icon.Box className="h-4.5 w-4.5 text-white" /></div>
            <div>
              <div className="text-sm font-semibold text-slate-100">Anki</div>
              <div className="text-xs text-slate-500">{cards.length} card{cards.length === 1 ? "" : "s"} ready</div>
            </div>
          </div>
          <label className="text-xs font-medium uppercase tracking-wide text-slate-500">Deck name</label>
          <input
            value={deckName}
            onChange={(e) => setDeckName(e.target.value)}
            className="w-full rounded-xl border border-slate-800 bg-slate-900 px-3.5 py-2.5 text-sm text-slate-100 outline-none transition focus:border-violet-600 focus:ring-1 focus:ring-violet-600"
          />
          <button
            onClick={handleAnkiExport}
            disabled={cards.length === 0}
            className="flex items-center justify-center gap-2 rounded-xl bg-blue-600 px-4 py-2.5 text-sm font-medium text-white transition hover:bg-blue-500 disabled:cursor-not-allowed disabled:opacity-40"
          >
            <Icon.Download className="h-4 w-4" /> Download .txt for Anki
          </button>
          <p className="text-xs leading-relaxed text-slate-500">
            In Anki: File → Import, pick this file. The header lines pre-select tab separation, the Basic note type, and the "{deckName || "Mastery Dashboard"}" deck automatically.
          </p>
        </div>

        <div className="flex flex-col gap-4 rounded-2xl border border-slate-800 bg-slate-900/40 p-5">
          <div className="flex items-center gap-2.5">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-slate-700"><Icon.Notion className="h-4.5 w-4.5 text-white" /></div>
            <div>
              <div className="text-sm font-semibold text-slate-100">Notion</div>
              <div className="text-xs text-slate-500">Notes, flashcard table &amp; mindmap</div>
            </div>
          </div>
          <p className="text-xs leading-relaxed text-slate-500">
            Bundles your notebook summary, flashcards (as a Markdown table), and mindmap (as nested bullets) into one .md file.
          </p>
          <button
            onClick={handleNotionExport}
            className="mt-auto flex items-center justify-center gap-2 rounded-xl bg-slate-100 px-4 py-2.5 text-sm font-medium text-slate-900 transition hover:bg-white"
          >
            <Icon.Download className="h-4 w-4" /> Download .md for Notion
          </button>
          <p className="text-xs leading-relaxed text-slate-500">
            In Notion: any page → "⋯" menu → Import → Markdown &amp; CSV, or drag the file straight onto the sidebar.
          </p>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- Settings Panel ------------------------------ */

function SettingsPanel({ open, onClose, apiKey, setApiKey, model, setModel }) {
  const [showKey, setShowKey] = useState(false);
  const [draftKey, setDraftKey] = useState(apiKey);
  const [draftModel, setDraftModel] = useState(model);

  useEffect(() => {
    if (open) {
      setDraftKey(apiKey);
      setDraftModel(model);
    }
  }, [open, apiKey, model]);

  if (!open) return null;

  const save = () => {
    setApiKey(draftKey.trim());
    setModel(draftModel.trim() || DEFAULT_MODEL);
    onClose();
  };

  const clear = () => {
    setDraftKey("");
    setApiKey("");
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4" onClick={onClose}>
      <div
        onClick={(e) => e.stopPropagation()}
        className="w-full max-w-lg rounded-2xl border border-slate-800 bg-slate-950 p-6 shadow-2xl animate-[fadeIn_0.2s_ease-out]"
      >
        <div className="mb-4 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-violet-600"><Icon.Key className="h-4.5 w-4.5 text-white" /></div>
            <div>
              <div className="text-sm font-semibold text-slate-100">AI Settings</div>
              <div className="text-xs text-slate-500">Powers real summaries, flashcards, feedback &amp; chat</div>
            </div>
          </div>
          <button onClick={onClose} className="rounded-lg p-1.5 text-slate-500 hover:bg-slate-900 hover:text-slate-300"><Icon.X className="h-4 w-4" /></button>
        </div>

        <div className="flex flex-col gap-4">
          <div>
            <label className="mb-1.5 block text-xs font-medium uppercase tracking-wide text-slate-500">Claude API Key</label>
            <div className="relative">
              <input
                type={showKey ? "text" : "password"}
                value={draftKey}
                onChange={(e) => setDraftKey(e.target.value)}
                placeholder="sk-ant-…"
                className="w-full rounded-xl border border-slate-800 bg-slate-900 px-3.5 py-2.5 pr-10 text-sm text-slate-100 placeholder-slate-600 outline-none transition focus:border-violet-600 focus:ring-1 focus:ring-violet-600"
              />
              <button
                type="button"
                onClick={() => setShowKey((s) => !s)}
                className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300"
              >
                {showKey ? <Icon.EyeOff className="h-4 w-4" /> : <Icon.Eye className="h-4 w-4" />}
              </button>
            </div>
          </div>

          <div>
            <label className="mb-1.5 block text-xs font-medium uppercase tracking-wide text-slate-500">Model</label>
            <input
              type="text"
              value={draftModel}
              onChange={(e) => setDraftModel(e.target.value)}
              placeholder={DEFAULT_MODEL}
              className="w-full rounded-xl border border-slate-800 bg-slate-900 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 outline-none transition focus:border-violet-600 focus:ring-1 focus:ring-violet-600"
            />
            <p className="mt-1 text-xs text-slate-500">
              Defaults to {DEFAULT_MODEL}. See docs.claude.com/en/docs/about-claude/models for current model IDs.
            </p>
          </div>

          <div className="flex items-start gap-2 rounded-xl border border-slate-800 bg-slate-900/50 px-3.5 py-3 text-xs leading-relaxed text-slate-400">
            <Icon.Alert className="h-4 w-4 shrink-0 text-slate-500" />
            Stored only in this browser's localStorage and sent directly from your browser to Anthropic's API — never to any other server. Anyone with access to this browser profile could read it back out, so don't use this on a shared computer with a key you care about.
          </div>

          <div className="flex items-center justify-between gap-3 pt-1">
            <button onClick={clear} className="flex items-center gap-1.5 text-xs font-medium text-rose-400 hover:text-rose-300">
              <Icon.Trash className="h-3.5 w-3.5" /> Clear key
            </button>
            <div className="flex items-center gap-2">
              <button onClick={onClose} className="rounded-xl border border-slate-700 px-4 py-2 text-sm font-medium text-slate-300 hover:bg-slate-900">Cancel</button>
              <button onClick={save} className="rounded-xl bg-violet-600 px-4 py-2 text-sm font-medium text-white hover:bg-violet-500">Save</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- Chat Drawer ---------------------------------- */

function ChatDrawer({ open, onClose, messages, onSend, context, onClearContext, hasKey }) {
  const [input, setInput] = useState("");
  const [sending, setSending] = useState(false);
  const [error, setError] = useState(null);
  const listRef = useRef(null);

  useEffect(() => {
    if (listRef.current) {
      listRef.current.scrollTo({ top: listRef.current.scrollHeight, behavior: "smooth" });
    }
  }, [messages, open]);

  const handleSend = async () => {
    if (!input.trim() || sending || !hasKey) return;
    setError(null);
    const text = input.trim();
    setInput("");
    setSending(true);
    try {
      await onSend(text);
    } catch (err) {
      setError(err.message);
    } finally {
      setSending(false);
    }
  };

  return (
    <>
      <div
        className={`fixed inset-0 z-40 bg-black/40 transition-opacity duration-300 ${open ? "opacity-100" : "pointer-events-none opacity-0"}`}
        onClick={onClose}
      />
      <aside
        className={`fixed right-0 top-0 z-50 flex h-full w-full max-w-md flex-col border-l border-slate-800 bg-slate-950 shadow-2xl transition-transform duration-300 ease-out ${
          open ? "translate-x-0" : "translate-x-full"
        }`}
      >
        <div className="flex items-center justify-between border-b border-slate-800 px-5 py-4">
          <div className="flex items-center gap-2.5">
            <div className="flex h-8 w-8 items-center justify-center rounded-lg bg-violet-600"><Icon.MessageCircle className="h-4 w-4 text-white" /></div>
            <div>
              <div className="text-sm font-semibold text-slate-100">Study Buddy</div>
              <div className="text-[11px] text-slate-500">{hasKey ? "Powered by Claude" : "Add an API key to chat"}</div>
            </div>
          </div>
          <button onClick={onClose} className="rounded-lg p-1.5 text-slate-500 hover:bg-slate-900 hover:text-slate-300"><Icon.X className="h-4 w-4" /></button>
        </div>

        <div ref={listRef} className="flex flex-1 flex-col gap-3 overflow-y-auto px-5 py-4">
          {messages.length === 0 && (
            <p className="text-sm text-slate-500">
              Ask about anything in your notes or mindmap. Highlight text anywhere in the app, or hover a mindmap node, to bring it in as context.
            </p>
          )}
          {messages.map((m, i) => (
            <div
              key={i}
              className={`max-w-[85%] whitespace-pre-wrap rounded-2xl px-3.5 py-2.5 text-sm leading-relaxed ${
                m.role === "user" ? "self-end bg-violet-600 text-white" : "self-start border border-slate-800 bg-slate-900 text-slate-200"
              }`}
            >
              {m.content}
            </div>
          ))}
          {sending && (
            <div className="flex items-center gap-2 self-start rounded-2xl border border-slate-800 bg-slate-900 px-3.5 py-2.5 text-sm text-slate-400">
              <span className="h-2 w-2 animate-pulse rounded-full bg-violet-400" /> Thinking…
            </div>
          )}
          {error && (
            <div className="self-start rounded-2xl border border-rose-800/50 bg-rose-950/40 px-3.5 py-2.5 text-sm text-rose-300">{error}</div>
          )}
        </div>

        {context && (
          <div className="mx-5 mb-2 flex items-start gap-2 rounded-xl border border-violet-800/50 bg-violet-950/30 px-3 py-2 text-xs text-violet-200">
            <span className="mt-0.5 shrink-0 font-medium uppercase tracking-wide text-violet-400">Context</span>
            <span className="line-clamp-2 flex-1">{context.label}</span>
            <button onClick={onClearContext} className="shrink-0 text-violet-400 hover:text-violet-200"><Icon.X className="h-3.5 w-3.5" /></button>
          </div>
        )}

        <div className="border-t border-slate-800 p-4">
          <div className="flex items-end gap-2">
            <textarea
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); handleSend(); } }}
              rows={2}
              placeholder={hasKey ? "Ask your Study Buddy…" : "Add your Claude API key in Settings first…"}
              disabled={!hasKey}
              className="flex-1 resize-none rounded-xl border border-slate-800 bg-slate-900 px-3.5 py-2.5 text-sm text-slate-100 placeholder-slate-600 outline-none transition focus:border-violet-600 focus:ring-1 focus:ring-violet-600 disabled:opacity-50"
            />
            <button
              onClick={handleSend}
              disabled={!hasKey || !input.trim() || sending}
              className="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl bg-violet-600 text-white transition hover:bg-violet-500 disabled:cursor-not-allowed disabled:opacity-40"
            >
              <Icon.Send className="h-4 w-4" />
            </button>
          </div>
        </div>
      </aside>
    </>
  );
}

/* ---------------------------- Sidebar & Layout ---------------------------- */

const NAV_ITEMS = [
  { key: "recall", label: "Active Recall & Spaced Repetition", short: "Active Recall", icon: Icon.Brain },
  { key: "capture", label: "Capture & Summarize", short: "Capture", icon: Icon.Clipboard },
  { key: "feynman", label: "Feynman Sandbox", short: "Feynman Sandbox", icon: Icon.Sandbox },
  { key: "mindmap", label: "Visual Mindmap", short: "Visual Mindmap", icon: Icon.Tree },
  { key: "export", label: "Export Center", short: "Export", icon: Icon.Download },
];

function loadCardsFromStorage() {
  try {
    const raw = window.localStorage.getItem(LS_KEYS.cards);
    if (!raw) return INITIAL_CARDS;
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) && parsed.length ? parsed : INITIAL_CARDS;
  } catch {
    return INITIAL_CARDS;
  }
}

function MasteryDashboard() {
  const [activeView, setActiveView] = useState("recall");
  const [cards, setCards] = useState(loadCardsFromStorage);
  const [feynmanSeed, setFeynmanSeed] = useState(null);
  const [notebookText, setNotebookText] = useState("");
  const [summaryBullets, setSummaryBullets] = useState([]);

  const [apiKey, setApiKey] = useState(() => {
    try { return window.localStorage.getItem(LS_KEYS.apiKey) || ""; } catch { return ""; }
  });
  const [model, setModel] = useState(() => {
    try { return window.localStorage.getItem(LS_KEYS.model) || DEFAULT_MODEL; } catch { return DEFAULT_MODEL; }
  });
  const [settingsOpen, setSettingsOpen] = useState(false);

  const [chatOpen, setChatOpen] = useState(false);
  const [chatMessages, setChatMessages] = useState([]);
  const [chatContext, setChatContext] = useState(null);

  useEffect(() => {
    try { window.localStorage.setItem(LS_KEYS.cards, JSON.stringify(cards)); } catch { /* storage unavailable */ }
  }, [cards]);
  useEffect(() => {
    try { window.localStorage.setItem(LS_KEYS.apiKey, apiKey); } catch { /* storage unavailable */ }
  }, [apiKey]);
  useEffect(() => {
    try { window.localStorage.setItem(LS_KEYS.model, model); } catch { /* storage unavailable */ }
  }, [model]);

  const aiSettings = useMemo(() => ({ apiKey, model, hasKey: !!apiKey }), [apiKey, model]);

  const masteryPercent = useMemo(() => {
    const total = cards.length * 5;
    const earned = cards.reduce((sum, c) => sum + c.box, 0);
    return Math.round((earned / total) * 100);
  }, [cards]);

  const addCardsFromImport = useCallback((newCards) => {
    setCards((prev) => {
      let nextId = prev.reduce((max, c) => Math.max(max, c.id), 0) + 1;
      const withIds = newCards.map((c) => ({ ...c, id: nextId++, box: 1 }));
      return [...prev, ...withIds];
    });
  }, []);

  const sendToFeynman = useCallback((topic) => {
    setFeynmanSeed({ topic, nonce: Date.now() });
    setActiveView("feynman");
  }, []);

  const askAboutText = useCallback((label) => {
    const trimmed = label.length > 500 ? label.slice(0, 500) + "…" : label;
    setChatContext({ label: trimmed.length > 90 ? trimmed.slice(0, 90) + "…" : trimmed, content: trimmed });
    setChatOpen(true);
  }, []);

  const handleChatSend = useCallback(async (text) => {
    const composed = chatContext ? `Regarding "${chatContext.content}":\n\n${text}` : text;
    const userMsg = { role: "user", content: composed };
    const history = [...chatMessages, userMsg];
    setChatMessages(history);
    setChatContext(null);
    const apiMessages = history.map(({ role, content }) => ({ role, content }));
    const reply = await aiChatReply(apiMessages, aiSettings);
    setChatMessages((m) => [...m, { role: "assistant", content: reply }]);
  }, [chatMessages, chatContext, aiSettings]);

  return (
    <AISettingsContext.Provider value={aiSettings}>
      <div className="flex min-h-screen w-full bg-slate-950 text-slate-100">
        {/* Sidebar */}
        <aside className="flex w-64 shrink-0 flex-col border-r border-slate-800/80 bg-slate-950/95 px-4 py-6">
          <div className="mb-8 flex items-center gap-2.5 px-2">
            <div className="flex h-9 w-9 items-center justify-center rounded-xl bg-violet-600 shadow-lg shadow-violet-900/40">
              <Icon.Sparkle className="h-5 w-5 text-white" />
            </div>
            <div>
              <div className="text-sm font-semibold leading-tight text-slate-100">Mastery Dashboard</div>
              <div className="text-[11px] text-slate-500">Study Powerhouse</div>
            </div>
          </div>

          <nav className="flex flex-col gap-1.5">
            {NAV_ITEMS.map((item) => {
              const ActiveIcon = item.icon;
              const isActive = activeView === item.key;
              return (
                <button
                  key={item.key}
                  onClick={() => setActiveView(item.key)}
                  className={`group relative flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm transition-all duration-200 ${
                    isActive ? "bg-violet-600/15 text-violet-200" : "text-slate-400 hover:bg-slate-900 hover:text-slate-200"
                  }`}
                >
                  {isActive && <span className="absolute left-0 top-1/2 h-5 w-1 -translate-y-1/2 rounded-r-full bg-violet-500" />}
                  <ActiveIcon className={`h-4.5 w-4.5 shrink-0 ${isActive ? "text-violet-300" : "text-slate-500 group-hover:text-slate-300"}`} />
                  <span className="font-medium">{item.short}</span>
                </button>
              );
            })}
          </nav>

          <div className="mt-6 flex flex-col gap-2">
            <button
              onClick={() => setChatOpen(true)}
              className="flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-medium text-slate-400 transition hover:bg-slate-900 hover:text-slate-200"
            >
              <Icon.MessageCircle className="h-4.5 w-4.5 shrink-0" /> Study Buddy
              {!aiSettings.hasKey && <span className="ml-auto h-1.5 w-1.5 rounded-full bg-amber-400" />}
            </button>
            <button
              onClick={() => setSettingsOpen(true)}
              className="flex items-center gap-3 rounded-xl px-3 py-2.5 text-left text-sm font-medium text-slate-400 transition hover:bg-slate-900 hover:text-slate-200"
            >
              <Icon.Settings className="h-4.5 w-4.5 shrink-0" /> Settings
            </button>
          </div>

          <div className="mt-auto flex flex-col gap-3 rounded-2xl border border-slate-800 bg-slate-900/50 p-4">
            <div className="text-[11px] font-medium uppercase tracking-wide text-slate-500">Overall Mastery</div>
            <ProgressRing percent={masteryPercent} size={52} stroke={6} />
            <div className="h-1.5 w-full overflow-hidden rounded-full bg-slate-800">
              <div
                className="h-full rounded-full bg-gradient-to-r from-violet-500 to-fuchsia-500 transition-all duration-700 ease-out"
                style={{ width: `${masteryPercent}%` }}
              />
            </div>
          </div>
        </aside>

        {/* Main content */}
        <main className="flex-1 overflow-y-auto px-6 py-8 sm:px-10">
          <div key={activeView} className="mx-auto max-w-5xl animate-[fadeIn_0.35s_ease-out]">
            {activeView === "recall" && <ActiveRecallView cards={cards} setCards={setCards} />}
            {activeView === "capture" && (
              <CaptureView
                notebookText={notebookText}
                setNotebookText={setNotebookText}
                onAddCards={addCardsFromImport}
                onSendToFeynman={sendToFeynman}
                onAskSelection={askAboutText}
              />
            )}
            {activeView === "feynman" && <FeynmanSandboxView seed={feynmanSeed} onAskSelection={askAboutText} />}
            {activeView === "mindmap" && <VisualMindmapView onAskNode={askAboutText} />}
            {activeView === "export" && <ExportView cards={cards} notebookText={notebookText} summaryBullets={summaryBullets} />}
          </div>
        </main>

        <SettingsPanel
          open={settingsOpen}
          onClose={() => setSettingsOpen(false)}
          apiKey={apiKey}
          setApiKey={setApiKey}
          model={model}
          setModel={setModel}
        />

        <ChatDrawer
          open={chatOpen}
          onClose={() => setChatOpen(false)}
          messages={chatMessages}
          onSend={handleChatSend}
          context={chatContext}
          onClearContext={() => setChatContext(null)}
          hasKey={aiSettings.hasKey}
        />

        <style>{`
          @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
          }
        `}</style>
      </div>
    </AISettingsContext.Provider>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<MasteryDashboard />);
</script>
</body>
</html>
